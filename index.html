<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operation Trish — Gate Crash Mission Briefing</title>
<style>
:root{color-scheme:dark;--bg:#0a0e17;--surface:#131a2a;--text:#c8d6e5;--dim:#5a6f8a;--border:#1e2d45;--accent:#e74c3c;--gold:#f0c040;--green:#27ae60;--amber:#f39c12;--radius:6px;--mono:'Courier New',Courier,monospace;--serif:Georgia,'Times New Roman',serif;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);margin:0;font-family:var(--sans);color:var(--text);line-height:1.6}
.container{max-width:820px;margin:0 auto;padding:16px}

/* Agent Badge */
.agent-badge-wrap{position:sticky;top:0;z-index:50;display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:8px 0;background:var(--bg)}
.agent-badge{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:4px 14px;font-family:var(--mono);font-size:.75rem;color:var(--gold);cursor:pointer;transition:border-color .2s}
.agent-badge:hover{border-color:var(--gold)}
.agent-badge-input{background:var(--surface);border:1px solid var(--gold);border-radius:20px;padding:4px 14px;font-family:var(--mono);font-size:.75rem;color:var(--gold);outline:none;width:180px}

/* Top Secret Banner */
.ts-banner{text-align:center;padding:24px 16px 8px}
.ts-stamp{display:inline-block;border:4px solid var(--accent);padding:8px 32px;font-family:var(--mono);font-size:clamp(1.2rem,4vw,1.6rem);font-weight:700;color:var(--accent);letter-spacing:6px;transform:rotate(-2deg);text-transform:uppercase;position:relative}
.ts-stamp::before{content:'';position:absolute;inset:-2px;border:1px solid var(--accent);opacity:.4}
.ts-sub{font-family:var(--mono);font-size:.75rem;color:var(--dim);letter-spacing:3px;margin-top:12px;text-transform:uppercase}

/* Countdown */
.countdown-wrap{text-align:center;padding:20px 16px;margin:12px 0;background:linear-gradient(135deg,rgba(231,76,60,.08),rgba(240,192,64,.06));border:1px solid var(--border);border-radius:8px}
.countdown-label{font-family:var(--mono);font-size:.65rem;color:var(--dim);letter-spacing:4px;text-transform:uppercase;margin-bottom:8px}
.countdown-digits{font-family:var(--mono);display:flex;align-items:baseline;justify-content:center;gap:4px;flex-wrap:wrap}
.cd-num{font-size:clamp(1.4rem,5vw,2.2rem);font-weight:700;color:var(--accent);letter-spacing:2px;animation:pulse-glow 2s ease-in-out infinite}
.cd-sep{font-size:.55rem;color:var(--dim);letter-spacing:2px;margin:0 2px}
.cd-dot{font-size:1.2rem;color:var(--dim);margin:0 4px}
@keyframes pulse-glow{0%,100%{opacity:1}50%{opacity:.7}}

/* Cover */
.cover{text-align:center;padding:40px 16px 48px;border-bottom:1px solid var(--border)}
.cover-title{font-family:var(--serif);font-size:clamp(2rem,6vw,3.2rem);color:#fff;letter-spacing:2px;margin:16px 0 8px}
.cover-subtitle{font-family:var(--mono);color:var(--gold);font-size:clamp(.85rem,2.5vw,1.1rem);letter-spacing:3px}
.meta-info{font-family:var(--mono);font-size:.8rem;color:var(--dim);margin-top:24px;line-height:2}
.meta-info span{color:var(--text)}
.redacted{background:var(--dim);color:var(--dim);padding:0 8px;border-radius:2px;cursor:pointer;transition:all .3s}
.redacted:hover,.redacted.revealed{background:transparent;color:var(--accent)}

/* Section */
.section{padding:32px 0;border-bottom:1px solid var(--border)}
.section-label{font-family:var(--mono);font-size:.7rem;color:var(--accent);letter-spacing:4px;text-transform:uppercase;margin-bottom:4px}
.section-title{font-family:var(--serif);font-size:clamp(1.3rem,4vw,1.8rem);color:#fff;margin-bottom:16px}
.subsection-title{font-family:var(--serif);font-size:clamp(1.05rem,3vw,1.3rem);color:var(--gold);margin:20px 0 8px}
.rules-text{margin-top:12px;font-family:var(--mono);color:var(--accent);font-size:.85rem}

/* Crew Grid */
.crew-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:12px 0}
.crew-badge{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:10px;text-align:center;font-size:.8rem}
.crew-name{color:#fff;font-weight:600;display:block}
.crew-role{font-family:var(--mono);font-size:.65rem;color:var(--dim);letter-spacing:1px;margin-top:2px;display:block}

/* Timeline */
.timeline-total{font-family:var(--mono);font-size:.85rem;color:var(--amber);margin-bottom:16px}
.timeline{position:relative;padding-left:32px;margin:16px 0}
.timeline::before{content:'';position:absolute;left:12px;top:0;bottom:0;width:2px;background:var(--border)}
.tl-item{position:relative;margin:16px 0;padding:8px 0}
.tl-item::before{content:'';position:absolute;left:-24px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.tl-time{font-family:var(--mono);font-size:.75rem;color:var(--amber)}
.tl-desc{font-size:.9rem;margin-top:2px}

/* Station Cards */
.station{background:var(--surface);border:1px solid var(--border);border-radius:6px;margin:20px 0;overflow:hidden;transition:border-color .2s}
.station:hover{border-color:var(--accent)}
.station.drag-over{border-color:var(--gold);box-shadow:0 0 12px rgba(240,192,64,.2)}
.station-header{display:flex;align-items:center;gap:8px;padding:12px 16px;cursor:pointer;user-select:none;flex-wrap:wrap}
@media(min-width:640px){.station-header{flex-wrap:nowrap;padding:16px 20px;gap:12px}}
.station-drag-handle{color:var(--dim);font-size:1rem;cursor:grab;padding:0 4px;flex-shrink:0}
.station-drag-handle:active{cursor:grabbing}
.station-num{background:var(--accent);color:#fff;font-family:var(--mono);font-weight:700;font-size:.85rem;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.station-title-wrap{flex:1;min-width:0}
.station-name{font-family:var(--serif);font-size:1.1rem;color:#fff;margin:0}
.station-tagline{font-family:var(--mono);font-size:.7rem;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-top:2px}
.station-chevron{color:var(--dim);font-size:1.2rem;flex-shrink:0}
.station-body{padding:20px;border-top:1px solid var(--border)}
.station-reorder-btns{display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.station-reorder-btn{background:transparent;border:1px solid var(--border);border-radius:3px;width:22px;height:18px;font-size:.6rem;color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.station-reorder-btn:hover{border-color:var(--gold);color:var(--gold)}

/* Tags */
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.tag{font-family:var(--mono);font-size:.65rem;padding:3px 10px;border-radius:12px;letter-spacing:1px;text-transform:uppercase}
.tag-funny{background:#1a3a1a;color:#4ade80;border:1px solid #27ae60}
.tag-savage{background:#3a1a1a;color:#f87171;border:1px solid #e74c3c}
.tag-sweet{background:#3a2a1a;color:#fbbf24;border:1px solid #f39c12}
.tag-photo{background:#1a2a3a;color:#60a5fa;border:1px solid #3b82f6}

/* Instructions */
.concept-label{color:var(--gold);font-family:var(--mono);font-size:.75rem;letter-spacing:2px;margin:12px 0 8px}
.instructions{background:rgba(255,255,255,.03);border-left:3px solid var(--gold);padding:12px 16px;margin:12px 0;border-radius:0 4px 4px 0;font-size:.9rem}
.instructions-title{color:var(--gold);font-size:.85rem;margin-bottom:8px}
.instructions ol,.instructions ul{padding-left:20px;margin:8px 0}
.instructions li{margin:6px 0}
.instructions strong{color:var(--gold)}

/* Callouts */
.callout{display:flex;gap:8px;align-items:flex-start;margin:8px 0;font-size:.85rem}
.callout-icon{font-size:1rem;flex-shrink:0;margin-top:2px}
.callout-text{flex:1}
.callout-text strong{color:var(--text)}

/* Vote Buttons */
.vote-row{display:flex;gap:4px;flex-shrink:0}
.vote-btn{background:transparent;border:1px solid var(--border);border-radius:16px;padding:2px 8px;font-size:.75rem;cursor:pointer;color:var(--dim);display:flex;align-items:center;gap:3px;transition:all .15s}
.vote-btn:hover{border-color:var(--dim)}
.vote-active-up{border-color:var(--green);color:var(--green);background:rgba(39,174,96,.1)}
.vote-active-down{border-color:var(--accent);color:var(--accent);background:rgba(231,76,60,.1)}
.vote-count{font-family:var(--mono);font-size:.7rem}

/* Duration Editor */
.duration-editor{display:flex;align-items:center;gap:2px;flex-shrink:0}
.dur-btn{background:transparent;border:1px solid var(--border);border-radius:4px;width:22px;height:22px;font-size:.85rem;color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .15s}
.dur-btn:hover{border-color:var(--amber);color:var(--amber)}
.dur-val{font-family:var(--mono);font-size:.7rem;color:var(--amber);white-space:nowrap;min-width:42px;text-align:center}

/* Comments */
.comment-section{margin-top:16px;border-top:1px solid var(--border);padding-top:12px}
.comment-toggle{background:none;border:none;font-family:var(--mono);font-size:.7rem;color:var(--dim);letter-spacing:2px;text-transform:uppercase;cursor:pointer;padding:4px 0}
.comment-toggle:hover{color:var(--text)}
.comment-list{margin-top:8px}
.comment-card{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:4px;padding:10px 12px;padding-right:50px;margin:6px 0;position:relative}
.comment-meta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.comment-name{font-family:var(--mono);font-size:.75rem;color:var(--gold);font-weight:600}
.comment-time{font-family:var(--mono);font-size:.6rem;color:var(--dim)}
.comment-text{font-size:.85rem;color:var(--text)}
.comment-empty{font-family:var(--mono);font-size:.75rem;color:var(--dim);padding:8px 0}
.comment-form{display:flex;gap:8px;margin-top:8px}
.comment-input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:8px 12px;font-size:.85rem;color:var(--text);font-family:var(--sans);outline:none}
.comment-input:focus{border-color:var(--dim)}
.comment-input::placeholder{color:var(--dim)}
.comment-submit{background:var(--accent);color:#fff;border:none;border-radius:4px;padding:8px 16px;font-family:var(--mono);font-size:.7rem;letter-spacing:2px;cursor:pointer;white-space:nowrap}
.comment-submit:disabled{opacity:.4;cursor:default}
.comment-delete{position:absolute;top:8px;right:8px;background:rgba(231,76,60,.15);border:1px solid rgba(231,76,60,.3);color:#e74c3c;cursor:pointer;font-size:.85rem;padding:4px 8px;border-radius:4px;opacity:.8;transition:all .15s}
.comment-delete:hover{color:#fff;opacity:1;background:rgba(231,76,60,.5)}

/* Supply Grid */
.supply-grid{display:grid;grid-template-columns:1fr;gap:16px;margin:16px 0}
@media(min-width:640px){.supply-grid{grid-template-columns:1fr 1fr}}
.supply-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:16px}
.supply-card-title{font-family:var(--mono);font-size:.8rem;color:var(--accent);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px}
.supply-note{font-family:var(--mono);font-size:.8rem;color:var(--amber);margin-bottom:12px}
.supply-list{list-style:none;padding:0}
.supply-item{padding:6px 0;font-size:.85rem;border-bottom:1px solid rgba(255,255,255,.04);display:flex;align-items:center;gap:6px}
.supply-item:last-child{border-bottom:none}
.supply-check{font-family:var(--mono);color:var(--dim);flex-shrink:0}
.supply-claimed .supply-check{color:var(--green)}
.supply-text{flex:1}
.supply-claimed .supply-text{color:var(--dim)}
.supply-claimer{font-family:var(--mono);font-size:.7rem;color:var(--green);font-weight:600}
.supply-claim-btn,.supply-unclaim-btn{background:none;border:1px solid var(--border);border-radius:12px;padding:1px 8px;font-family:var(--mono);font-size:.6rem;cursor:pointer;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;transition:all .15s;flex-shrink:0}
.supply-claim-btn{color:var(--dim)}
.supply-claim-btn:hover{border-color:var(--green);color:var(--green)}
.supply-unclaim-btn{color:var(--dim)}
.supply-unclaim-btn:hover{border-color:var(--accent);color:var(--accent)}

/* Handler Assignments */
.handler-card{position:relative}
.handler-task-list{list-style:none;padding:0}
.handler-task{padding:4px 0;font-size:.85rem;display:flex;align-items:center;gap:6px}
.custom-task{color:var(--amber)}
.task-remove-btn{background:none;border:none;color:var(--dim);font-size:.7rem;cursor:pointer;padding:0 4px;margin-left:auto;flex-shrink:0}
.task-remove-btn:hover{color:var(--accent)}
.add-task-link{background:none;border:none;font-family:var(--mono);font-size:.7rem;color:var(--dim);cursor:pointer;padding:6px 0 0;letter-spacing:1px}
.add-task-link:hover{color:var(--gold)}
.add-task-form{display:flex;gap:6px;margin-top:8px;align-items:center}
.add-task-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:6px 10px;font-size:.8rem;color:var(--text);font-family:var(--sans);outline:none}
.add-task-input:focus{border-color:var(--dim)}
.add-task-input::placeholder{color:var(--dim)}
.add-task-submit{background:var(--gold);color:var(--bg);border:none;border-radius:4px;padding:6px 12px;font-family:var(--mono);font-size:.65rem;letter-spacing:1px;cursor:pointer}
.add-task-submit:disabled{opacity:.4}
.add-task-cancel{background:none;border:none;color:var(--dim);cursor:pointer;font-size:.85rem}

/* Ang Bao */
.angbao-box{background:linear-gradient(135deg,#3a1a1a,#1a1a2a);border:2px solid var(--accent);border-radius:8px;padding:20px;margin:16px 0;text-align:center}
.angbao-box h3{color:var(--accent);font-family:var(--serif);margin-bottom:8px}

/* Music */
.music-list{display:grid;grid-template-columns:1fr;gap:8px;margin:12px 0}
@media(min-width:480px){.music-list{grid-template-columns:1fr 1fr}}
.music-item{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:10px 14px;font-size:.85rem}
.music-song{color:#fff;font-weight:600}
.music-use{font-family:var(--mono);font-size:.7rem;color:var(--dim);margin-top:2px}

/* Checklist */
.checklist-group{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:16px 20px;margin:16px 0}
.checklist-title{font-family:var(--mono);color:var(--gold);font-size:.8rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.checklist-list{list-style:none;padding:0}
.checklist-item{padding:6px 0;font-size:.85rem;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;display:flex;align-items:flex-start;gap:6px}
.checklist-item:last-child{border-bottom:none}
.check-mark{font-family:var(--mono);color:var(--accent);flex-shrink:0}
.checklist-item.checked .check-mark{color:var(--green)}
.checklist-item.checked{color:var(--dim);text-decoration:line-through}
.backup-note{margin-bottom:12px;font-family:var(--mono);font-size:.85rem;color:var(--amber)}
.backup-meta{font-size:.8rem;color:var(--dim)}

/* Footer */
.footer{text-align:center;padding:32px 16px;font-family:var(--mono);font-size:.7rem;color:var(--dim);letter-spacing:2px}

/* Notification Bell */
.notif-bell-wrap{position:relative;display:inline-flex;align-items:center}
.notif-bell{background:none;border:1px solid var(--border);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;cursor:pointer;transition:border-color .2s,transform .15s;position:relative}
.notif-bell:hover{border-color:var(--gold);transform:scale(1.08)}
.notif-bell.has-new{animation:bell-ring 1.5s ease-in-out}
@keyframes bell-ring{0%{transform:rotate(0)}5%{transform:rotate(12deg)}10%{transform:rotate(-10deg)}15%{transform:rotate(8deg)}20%{transform:rotate(-6deg)}25%{transform:rotate(3deg)}30%,100%{transform:rotate(0)}}
.notif-badge{position:absolute;top:-4px;right:-4px;background:var(--accent);color:#fff;font-family:var(--mono);font-size:.6rem;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;line-height:1;border:2px solid var(--bg)}
.notif-dropdown{position:absolute;top:calc(100% + 8px);right:0;width:340px;max-height:420px;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.5);z-index:60;overflow:hidden;display:flex;flex-direction:column}
@media(max-width:480px){.notif-dropdown{width:calc(100vw - 32px);right:-8px}}
.notif-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.notif-header-title{font-family:var(--mono);font-size:.75rem;color:var(--gold);letter-spacing:2px;text-transform:uppercase}
.notif-header-count{font-family:var(--mono);font-size:.65rem;color:var(--dim)}
.notif-list{overflow-y:auto;flex:1;overscroll-behavior:contain}
.notif-item{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.03);font-size:.82rem;align-items:flex-start;transition:background .15s}
.notif-item:last-child{border-bottom:none}
.notif-item.unread{background:rgba(240,192,64,.04)}
.notif-icon{font-size:1rem;flex-shrink:0;margin-top:1px}
.notif-body{flex:1;min-width:0}
.notif-who{color:var(--gold);font-weight:600;font-family:var(--mono);font-size:.75rem}
.notif-what{color:var(--text);margin-top:2px;line-height:1.4}
.notif-what .notif-excerpt{color:var(--dim);font-style:italic}
.notif-meta{font-family:var(--mono);font-size:.6rem;color:var(--dim);margin-top:3px}
.notif-empty{padding:32px 16px;text-align:center;font-family:var(--mono);font-size:.8rem;color:var(--dim)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(10,14,23,.95);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-box{background:var(--surface);border:2px solid var(--accent);border-radius:8px;padding:40px 32px;max-width:400px;width:100%;text-align:center}
.modal-stamp{display:inline-block;border:3px solid var(--accent);padding:4px 20px;font-family:var(--mono);font-size:.85rem;font-weight:700;color:var(--accent);letter-spacing:4px;text-transform:uppercase;transform:rotate(-2deg);margin-bottom:20px}
.modal-title{font-family:var(--serif);font-size:1.4rem;color:#fff;margin-bottom:8px}
.modal-sub{font-family:var(--mono);font-size:.75rem;color:var(--dim);letter-spacing:2px;margin-bottom:24px}
.modal-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:12px 16px;font-family:var(--mono);font-size:1rem;color:var(--gold);text-align:center;letter-spacing:2px;outline:none;margin-bottom:16px}
.modal-input:focus{border-color:var(--accent)}
.modal-input::placeholder{color:var(--dim);letter-spacing:1px}
.modal-btn{background:var(--accent);color:#fff;border:none;border-radius:4px;padding:12px 32px;font-family:var(--mono);font-size:.85rem;font-weight:700;letter-spacing:3px;cursor:pointer;text-transform:uppercase;transition:opacity .2s}
.modal-btn:disabled{opacity:.4;cursor:default}
.modal-btn:hover:not(:disabled){opacity:.9}

/* Firebase status */
.fb-status{text-align:center;font-family:var(--mono);font-size:.7rem;padding:4px;color:var(--dim)}
.fb-status.error{color:var(--accent)}
</style>
</head>

// Get display number for a station based on current order
function sn(stationId) {
  const idx = state.order.indexOf(stationId);
  return idx >= 0 ? idx + 1 : '?';
}
function stationLabel(stationId) { return 'Station ' + sn(stationId); }
function stationPad(stationId) { const n = sn(stationId); return n < 10 ? '0' + n : '' + n; }

// Resolve {S:station-X} placeholders → "Station N"
function resolveRefs(text) {
  return text.replace(/\{S:(station-[a-z0-9-]+)\}/g, (_, id) => stationLabel(id));
}

function sanitizeName(name) {
  return name.replace(/[.#$\[\]/]/g, '_').trim();
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function formatTime(ts) {
  const d = new Date(typeof ts === 'number' ? ts : Date.parse(ts));
  if (isNaN(d)) return '';
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// Supply item label with dynamic station number
function supplyLabel(item) {
  let label = item.text;
  if (item.stn) label += ` <span style="color:var(--dim);font-family:var(--mono);font-size:.75rem">(${stationLabel(item.stn)})</span>`;
  return label;
}

let db = null;

function isConfigured() {
  return FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.includes('PASTE_YOUR');
}

function initFirebase() {
  if (!isConfigured()) {
    state.fbError = 'Firebase not configured — edit FIREBASE_CONFIG in index.html';
    render();
    return;
  }
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    state.fbConnected = true;
    seedIfEmpty();
    setupListeners();
  } catch (e) {
    state.fbError = 'Firebase init failed: ' + e.message;
    render();
  }
}

function seedIfEmpty() {
  db.ref('order').once('value', snap => {
    if (!snap.exists()) {
      db.ref('order').set(STATIONS.map(s => s.id));
      const durs = {};
      STATIONS.forEach(s => { durs[s.id] = s.defaultMin; });
      db.ref('durations').set(durs);
    }
  });
}

function setupListeners() {
  // Votes
  db.ref('votes').on('value', snap => {
    state.votes = snap.val() || {};
    render();
  });
  // Comments
  db.ref('comments').on('value', snap => {
    state.comments = snap.val() || {};
    render();
  });
  // Suggestions
  db.ref('suggestions').on('value', snap => {
    state.suggestions = snap.val() || {};
    render();
  });
  // Custom tasks
  db.ref('tasks').on('value', snap => {
    state.tasks = snap.val() || {};
    render();
  });
  // Supply claims
  db.ref('claims').on('value', snap => {
    state.claims = snap.val() || {};
    render();
  });
  // Station order
  db.ref('order').on('value', snap => {
    if (snap.val()) {
      const validIds = new Set(STATIONS.map(s => s.id));
      const configOrder = STATIONS.map(s => s.id);
      // Filter out deleted stations
      let order = snap.val().filter(id => validIds.has(id));
      // Insert any new stations in their correct config position
      for (let ci = 0; ci < configOrder.length; ci++) {
        const sid = configOrder[ci];
        if (!order.includes(sid)) {
          // Find the best insertion point based on config neighbors
          let inserted = false;
          for (let oi = 0; oi < order.length; oi++) {
            const configIdx = configOrder.indexOf(order[oi]);
            if (configIdx > ci) { order.splice(oi, 0, sid); inserted = true; break; }
          }
          if (!inserted) order.push(sid);
        }
      }
      state.order = order;
      // Persist cleaned order back to Firebase
      const snapOrder = snap.val();
      if (JSON.stringify(snapOrder) !== JSON.stringify(order)) {
        db.ref('order').set(order);
      }
    }
    render();
  });
  // Station durations
  db.ref('durations').on('value', snap => {
    if (snap.val()) state.durations = snap.val();
    render();
  });
}

function getLastSeenTs() {
  const key = 'op-trish-notif-seen-' + sanitizeName(state.userName || '_');
  return parseInt(localStorage.getItem(key) || '0', 10);
}
function setLastSeenTs() {
  const key = 'op-trish-notif-seen-' + sanitizeName(state.userName || '_');
  localStorage.setItem(key, String(Date.now()));
}

// Relative time formatting
function relativeTime(ts) {
  const diff = Date.now() - ts;
  if (diff < 0) return 'just now';
  const secs = Math.floor(diff / 1000);
  if (secs < 60) return 'just now';
  const mins = Math.floor(secs / 60);
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  const days = Math.floor(hrs / 24);
  if (days < 7) return days + 'd ago';
  return new Date(ts).toLocaleDateString();
}

// Station title lookup helper for activity items
function stationTitleById(sid) {
  const st = STATION_MAP[sid];
  return st ? st.title : sid;
}

// Build unified activity feed from comments, votes, suggestions
function buildActivityFeed() {
  const items = [];

  // Comments: { stationId: { pushKey: { name, text, ts, author } } }
  for (const [sid, entries] of Object.entries(state.comments)) {
    if (!STATION_MAP[sid]) continue;
    for (const [key, c] of Object.entries(entries)) {
      if (!c || !c.ts) continue;
      items.push({
        type: 'comment',
        who: c.author || c.name || 'Unknown',
        station: sid,
        text: c.text || '',
        ts: c.ts,
      });
    }
  }

  // Suggestions: { pushKey: { name, text, ts, author } }
  for (const [key, s] of Object.entries(state.suggestions)) {
    if (!s || !s.ts) continue;
    items.push({
      type: 'suggestion',
      who: s.author || s.name || 'Unknown',
      text: s.text || '',
      ts: s.ts,
    });
  }

  // Votes: { stationId: { sanitizedName: "up"|"down" } }
  // Votes don't have timestamps — we can't meaningfully sort them chronologically.
  // We'll add them with ts=0 so they appear at the bottom, but only show them once.
  for (const [sid, entries] of Object.entries(state.votes)) {
    if (!STATION_MAP[sid]) continue;
    for (const [who, voteType] of Object.entries(entries)) {
      items.push({
        type: 'vote',
        who: who,
        station: sid,
        vote: voteType,
        ts: 0, // no timestamp available
      });
    }
  }

  // Sort: newest first (votes with ts=0 go to end)
  items.sort((a, b) => b.ts - a.ts);

  return items;
}

function getUnreadCount() {
  const lastSeen = getLastSeenTs();
  const feed = buildActivityFeed();
  return feed.filter(item => item.ts > lastSeen).length;
}

function renderNotifBell() {
  const unread = getUnreadCount();
  const badgeHtml = unread > 0
    ? `<span class="notif-badge">${unread > 99 ? '99+' : unread}</span>`
    : '';
  const bellClass = unread > 0 ? 'notif-bell has-new' : 'notif-bell';

  let html = `<div class="notif-bell-wrap">
    <button class="${bellClass}" onclick="toggleNotif(event)" title="Activity feed">
      🔔${badgeHtml}
    </button>`;

  if (state.notifOpen) {
    html += renderNotifDropdown(unread);
  }

  html += `</div>`;
  return html;
}

function renderNotifDropdown(unreadCount) {
  const feed = buildActivityFeed();
  const lastSeen = getLastSeenTs();

  let html = `<div class="notif-dropdown" onclick="event.stopPropagation()">
    <div class="notif-header">
      <span class="notif-header-title">Activity</span>
      <span class="notif-header-count">${feed.length} total</span>
    </div>
    <div class="notif-list">`;

  if (feed.length === 0) {
    html += `<div class="notif-empty">No activity yet — be the first! 🕵️</div>`;
  } else {
    // Show max 50 items
    const shown = feed.slice(0, 50);
    for (const item of shown) {
      const isUnread = item.ts > lastSeen;
      const unreadCls = isUnread ? ' unread' : '';

      let icon = '';
      let whatHtml = '';

      if (item.type === 'comment') {
        icon = '💬';
        const excerpt = item.text.length > 80 ? item.text.slice(0, 80) + '…' : item.text;
        whatHtml = `commented on <strong>${escapeHtml(stationTitleById(item.station))}</strong>: <span class="notif-excerpt">"${escapeHtml(excerpt)}"</span>`;
      } else if (item.type === 'suggestion') {
        icon = '💡';
        const excerpt = item.text.length > 80 ? item.text.slice(0, 80) + '…' : item.text;
        whatHtml = `added a suggestion: <span class="notif-excerpt">"${escapeHtml(excerpt)}"</span>`;
      } else if (item.type === 'vote') {
        icon = item.vote === 'up' ? '👍' : '👎';
        whatHtml = `${item.vote === 'up' ? 'upvoted' : 'downvoted'} <strong>${escapeHtml(stationTitleById(item.station))}</strong>`;
      }

      const timeStr = item.ts > 0 ? relativeTime(item.ts) : '';

      html += `<div class="notif-item${unreadCls}">
        <span class="notif-icon">${icon}</span>
        <div class="notif-body">
          <span class="notif-who">${escapeHtml(item.who)}</span>
          <div class="notif-what">${whatHtml}</div>
          ${timeStr ? `<div class="notif-meta">${timeStr}</div>` : ''}
        </div>
      </div>`;
    }
  }

  html += `</div></div>`;
  return html;
}

function toggleNotif(event) {
  event.stopPropagation();
  state.notifOpen = !state.notifOpen;
  if (state.notifOpen) {
    // Mark all as read
    setLastSeenTs();
  }
  render();
}

// Close dropdown when clicking outside
document.addEventListener('click', (e) => {
  if (state.notifOpen && !e.target.closest('.notif-bell-wrap')) {

    render();

});

let renderScheduled = false;
function render() {
  if (renderScheduled) return;
  renderScheduled = true;
  requestAnimationFrame(() => {
    renderScheduled = false;
    doRender();
  });
}

function doRender() {
  const app = document.getElementById('app');
  // Save scroll position
  const scrollY = window.scrollY;
  // Save any focused element info
  const focusedId = document.activeElement?.dataset?.inputId;

  let html = '<div class="container">';

  // Name modal
  if (state.showNameModal) {
    html += renderNameModal();
  }

  // Agent badge (name display/change)
  html += renderAgentBadge();

  // Firebase status
  if (state.fbError) {
    html += `<div class="fb-status error">⚠️ ${escapeHtml(state.fbError)}</div>`;
  }

  // Top Secret Banner
  html += renderBanner();

  // Countdown
  html += '<div id="countdown-wrap" class="countdown-wrap"></div>';

  // Cover
  html += renderCover();

  // Section 01 — Personnel
  html += renderPersonnel();

  // Section 02 — Timeline
  html += renderTimeline();

  // Section 03 — Stations
  html += renderStations();

  // Section 04 — Supply List
  html += renderSupplyList();

  // Section 05 — Ang Bao
  html += renderAngBao();

  // Section 06 — Handler Assignments
  html += renderAssignments();

  // Section 07 — Suggestions
  html += renderSuggestions();

  // Section 08 — Soundtrack
  html += renderSoundtrack();

  // Section 09 — Photo & Video Guide
  html += renderPhotoGuide();

  // Section 10 — Day-of Checklist
  html += renderChecklist();

  // Section 11 — Backup Games
  html += renderBackup();

  // Footer
  html += renderFooter();

  html += '</div>'; // .container

  app.innerHTML = html;

  // Start countdown timer
  updateCountdown();
  if (!window._cdInterval) {
    window._cdInterval = setInterval(updateCountdown, 1000);
  }

  // Restore scroll
  window.scrollTo(0, scrollY);

  // Restore focus if possible
  if (focusedId) {
    const el = document.querySelector(`[data-input-id="${focusedId}"]`);
    if (el) el.focus();
  }
}

function renderTimeline() {
  // Build timeline from current order and durations
  const baseHour = 10; // 10:00 AM
  const baseMin = 30;  // 10:30 AM
  let totalMins = 0;
  const items = [];

  items.push({ time: "1030H", desc: "🚪 Agents arrive at the villa door (first floor, near main pool)", offset: 0 });

  let elapsed = 0;
  for (const sid of state.order) {
    const st = STATION_MAP[sid];
    if (!st) continue; // skip removed stations
    const dur = state.durations[sid] || 7;
    const startMins = elapsed;
    const hr = Math.floor((baseMin + startMins) / 60) + baseHour;
    const mn = (baseMin + startMins) % 60;
    const timeStr = `${String(hr).padStart(2,'0')}${String(mn).padStart(2,'0')}H`;
    items.push({ time: timeStr, desc: `${stationLabel(sid)}: ${st.title}`, dur: dur });
    elapsed += dur;
  }

  // Ang Bao negotiation
  const abHr = Math.floor((baseMin + elapsed) / 60) + baseHour;
  const abMn = (baseMin + elapsed) % 60;
  items.push({ time: `${String(abHr).padStart(2,'0')}${String(abMn).padStart(2,'0')}H`, desc: "🧧 Ang Bao Negotiation + Door Opens", dur: 5 });
  elapsed += 5;

  // End
  const endHr = Math.floor((baseMin + elapsed) / 60) + baseHour;
  const endMn = (baseMin + elapsed) % 60;
  items.push({ time: `${String(endHr).padStart(2,'0')}${String(endMn).padStart(2,'0')}H`, desc: "🎉 Mission Complete — Group Photos" });

  let html = `<div class="section">
    <div class="section-label">SECTION 01</div>
    <div class="section-title">Operational Timeline</div>
    <div class="timeline-total">Total estimated runtime: ${elapsed} min (${state.order.length} stations × ~${Math.round(elapsed/state.order.length)} min avg + ang bao)</div>
    <div class="rules-text">⏱️ Times auto-adjust when you reorder stations or edit durations.</div>
    <div class="timeline">`;
  for (const item of items) {
    html += `<div class="tl-item">
      <div class="tl-time">${item.time}${item.dur ? ` (${item.dur} min)` : ''}</div>
      <div class="tl-desc">${item.desc}</div>
    </div>`;
  }
  html += `</div></div>`;
  return html;
}

// ═══════════════════════════════════════════════════════════
// EVENT HANDLERS
// ═══════════════════════════════════════════════════════════

function confirmName() {
  const input = document.getElementById('name-input');
  if (!input || !input.value.trim()) return;
  state.userName = input.value.trim();
  localStorage.setItem('op-trish-name', state.userName);
  state.showNameModal = false;
  render();
}

function changeName() {
  const newName = prompt('Enter your codename:', state.userName);
  if (newName && newName.trim()) {
    state.userName = newName.trim();
    localStorage.setItem('op-trish-name', state.userName);
    render();
  }
}

function toggleRedact() {
  state.redactRevealed = !state.redactRevealed;
  render();
}

function toggleStation(stationId, event) {
  // Don't toggle if clicking interactive elements
  if (event && event.target.closest('.vote-row, .duration-editor, .station-reorder-btns, .station-drag-handle')) return;
  if (state.openStations.has(stationId)) {
    state.openStations.delete(stationId);
  } else {
    state.openStations.add(stationId);
  }
  render();
}

function toggleComments(stationId) {
  if (state.showComments.has(stationId)) {
    state.showComments.delete(stationId);
  } else {
    state.showComments.add(stationId);
  }
  render();
}

function submitComment(stationId, input) {
  if (!input || !input.value.trim()) return;
  fbAddComment(stationId, input.value);
  input.value = '';
}

function submitSuggestion(input) {
  if (!input || !input.value.trim()) return;
  fbAddSuggestion(input.value);
  input.value = '';
}

function changeDuration(stationId, delta) {
  const current = state.durations[stationId] || 7;
  const newVal = Math.max(1, current + delta);
  fbSetDuration(stationId, newVal);
}

function moveStation(stationId, direction) {
  const idx = state.order.indexOf(stationId);
  const newIdx = idx + direction;
  if (newIdx < 0 || newIdx >= state.order.length) return;
  const newOrder = [...state.order];
  [newOrder[idx], newOrder[newIdx]] = [newOrder[newIdx], newOrder[idx]];
  fbSetOrder(newOrder);
}

function showTaskForm(handlerKey) {
  state.addTaskForms.add(handlerKey);
  render();
  // Focus the input after render
  setTimeout(() => {
    const input = document.querySelector(`[data-input-id="task-${handlerKey}"]`);
    if (input) input.focus();
  }, 50);
}

function cancelTask(handlerKey) {
  state.addTaskForms.delete(handlerKey);
  render();
}

function submitTask(handlerKey, input) {
  if (!input || !input.value.trim()) return;
  fbAddTask(handlerKey, input.value);
  input.value = '';
  state.addTaskForms.delete(handlerKey);
}

function toggleCheck(key) {
  state.checkStates[key] = !state.checkStates[key];
  localStorage.setItem('op-trish-checks', JSON.stringify(state.checkStates));
  render();
}

// ═══════════════════════════════════════════════════════════
// COUNTDOWN
// ═══════════════════════════════════════════════════════════

function updateCountdown() {
  const el = document.getElementById('countdown-wrap');
  if (!el) return;

  // May 24, 2026 10:30 AM PHT (UTC+8)
  const target = new Date('2026-05-24T02:30:00Z'); // 10:30 AM PHT = 2:30 AM UTC
  const now = new Date();
  const diff = target - now;

  if (diff <= 0) {
    el.innerHTML = `<div class="countdown-label">OPERATION STATUS</div>
      <div style="font-family:var(--mono);font-size:1.4rem;color:var(--green);letter-spacing:4px">MISSION COMPLETE 🎉</div>`;
    return;
  }

  const days = Math.floor(diff / 86400000);
  const hrs = Math.floor((diff % 86400000) / 3600000);
  const mins = Math.floor((diff % 3600000) / 60000);
  const secs = Math.floor((diff % 60000) / 1000);

  el.innerHTML = `<div class="countdown-label">TIME TO EXTRACTION</div>
    <div class="countdown-digits">
      <span class="cd-num">${days}</span><span class="cd-sep">DAYS</span>
      <span class="cd-dot">·</span>
      <span class="cd-num">${String(hrs).padStart(2,'0')}</span><span class="cd-sep">HRS</span>
      <span class="cd-dot">·</span>
      <span class="cd-num">${String(mins).padStart(2,'0')}</span><span class="cd-sep">MIN</span>
      <span class="cd-dot">·</span>
      <span class="cd-num">${String(secs).padStart(2,'0')}</span><span class="cd-sep">SEC</span>
    </div>`;
}

// ═══════════════════════════════════════════════════════════
// DRAG AND DROP (Station Reorder)
// ═══════════════════════════════════════════════════════════

let draggedStationId = null;

function onDragStart(e, stationId) {
  draggedStationId = stationId;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', stationId);
  // Add a slight delay to let the drag image render
  setTimeout(() => {
    e.target.style.opacity = '0.4';
  }, 0);
}

function onDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const station = e.target.closest('.station');
  if (station) station.classList.add('drag-over');
}

function onDragLeave(e) {
  const station = e.target.closest('.station');
  if (station) station.classList.remove('drag-over');
}

function onDrop(e, targetId) {
  e.preventDefault();
  const station = e.target.closest('.station');
  if (station) station.classList.remove('drag-over');

  if (!draggedStationId || draggedStationId === targetId) return;

  const newOrder = [...state.order];
  const fromIdx = newOrder.indexOf(draggedStationId);
  const toIdx = newOrder.indexOf(targetId);
  if (fromIdx === -1 || toIdx === -1) return;

  // Remove from old position and insert at new position
  newOrder.splice(fromIdx, 1);
  newOrder.splice(toIdx, 0, draggedStationId);

  fbSetOrder(newOrder);
  draggedStationId = null;
}

function onDragEnd(e) {
  e.target.style.opacity = '';
  draggedStationId = null;
  // Remove all drag-over classes
  document.querySelectorAll('.station.drag-over').forEach(el => el.classList.remove('drag-over'));
}
