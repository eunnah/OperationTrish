<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="color-scheme" content="dark"/>
<title>Operation Trish — Virtual Padlock</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0a0a0a;--surface:#1a1a1e;--text:#d4a528;--dim:#5a5a60;--border:#2a2a30;--accent:#d4a528;--accent-red:#c0392b;--accent-green:#27ae60;--radius:4px;--font-mono:"Share Tech Mono","Courier New",monospace;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow:hidden;background:var(--bg);font-family:var(--font-mono);color:var(--text);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;height:100%}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.08) 2px,rgba(0,0,0,0.08) 4px)}
.container{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem;overflow:hidden}
.bg-grid{position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(212,165,40,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(212,165,40,0.03) 1px,transparent 1px);background-size:40px 40px;z-index:0}
.main{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:100%;max-width:440px}
.classified-header{width:100%;text-align:center;font-size:clamp(9px,2.5vw,11px);color:var(--accent-red);letter-spacing:.3em;text-transform:uppercase;margin-bottom:2rem;opacity:.8}
/* Lock icon */
.lock-wrap{margin-bottom:1rem;display:flex;align-items:center;justify-content:center}
.lock-wrap svg{filter:drop-shadow(0 0 12px rgba(212,165,40,0.5));transition:filter .5s}
.lock-wrap.unlocked svg{filter:drop-shadow(0 0 16px rgba(39,174,96,0.7))}
/* Digit cells */
.digits{display:flex;gap:clamp(12px,3vw,20px);justify-content:center}
.digit-wrap{position:relative;width:clamp(64px,18vw,88px);height:clamp(80px,22vw,110px)}
.digit-input{position:absolute;inset:0;width:100%;height:100%;text-align:center;outline:none;font-family:var(--font-mono);font-size:clamp(32px,10vw,56px);font-weight:700;color:transparent;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);caret-color:transparent;transition:border-color .2s,box-shadow .2s}
.digit-input.active{border-color:var(--accent);box-shadow:0 0 8px rgba(212,165,40,0.3)}
.digit-input.filled{color:var(--accent);box-shadow:0 0 12px rgba(212,165,40,0.4),inset 0 0 6px rgba(212,165,40,0.15)}
.digit-input.active:not(.filled){animation:pulse-glow 2s ease-in-out infinite}
.cursor-blink{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:2px;height:clamp(24px,7vw,36px);background:var(--accent);animation:cursor-blink 1s step-end infinite;pointer-events:none}
/* Bottom labels */
.label-row{margin-top:2rem;display:flex;flex-direction:column;align-items:center;gap:.5rem}
.label-title{font-size:clamp(14px,4vw,20px);font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--accent)}
.label-sub{font-size:clamp(9px,2.5vw,11px);color:var(--dim);letter-spacing:.25em;text-transform:uppercase}
.attempt-counter{font-size:clamp(9px,2.2vw,11px);color:var(--accent-red);letter-spacing:.2em;text-transform:uppercase;margin-top:1rem;opacity:0;transition:opacity .3s}
.attempt-counter.visible{opacity:.8}
/* Overlays */
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;pointer-events:none}
.denied-text{font-size:clamp(28px,8vw,52px);font-weight:700;color:var(--accent-red);text-transform:uppercase;letter-spacing:.15em;text-shadow:0 0 30px rgba(192,57,43,0.8),0 0 60px rgba(192,57,43,0.4);animation:stamp-in .4s cubic-bezier(.22,1,.36,1) forwards;text-align:center;padding:0 1rem}
.denied-sub{font-size:clamp(12px,3.5vw,16px);color:var(--accent-red);opacity:.8;margin-top:.75rem;letter-spacing:.2em;text-transform:uppercase;animation:fade-up .5s ease-out .3s both;text-align:center}
/* Success overlay */
.success-overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;background:var(--bg);animation:flash-green 1s ease-out}
.success-overlay .scanlines{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.08) 2px,rgba(0,0,0,0.08) 4px);z-index:201}
.success-overlay .declassified-band{position:absolute;top:0;left:0;right:0;padding:.5rem;background:var(--accent-green);text-align:center;font-size:clamp(10px,2.5vw,13px);color:#0a0a0a;letter-spacing:.3em;font-weight:700;z-index:202;animation:fade-up .5s ease-out .2s both}
.success-content{z-index:202;text-align:center;padding:0 1.5rem;width:100%;max-width:600px}
/* Phase 1: Unlocking */
.phase-unlock{display:flex;flex-direction:column;align-items:center;animation:fade-up .3s ease-out both}
.big-lock{position:relative;width:160px;height:180px}
.big-lock svg{filter:drop-shadow(0 0 40px rgba(39,174,96,0.6));display:block}
.code-accepted{font-size:clamp(18px,5vw,28px);font-weight:700;color:var(--accent-green);letter-spacing:.2em;text-transform:uppercase;margin-top:1.5rem;text-shadow:0 0 30px rgba(39,174,96,0.7);animation:reveal-text .8s ease-out .5s both}
.unlocking-text{font-size:clamp(11px,3vw,14px);color:var(--accent-green);opacity:.6;letter-spacing:.25em;text-transform:uppercase;margin-top:.5rem;animation:fade-up .5s ease-out 1s both}
/* Phase 2: Photo reveal */
.phase-reveal{display:flex;flex-direction:column;align-items:center;animation:fade-up .6s ease-out both}
.photo-container{position:relative;display:inline-block;animation:photo-emerge 1.2s cubic-bezier(.22,1,.36,1) both}
.photo-frame{border:3px solid var(--accent-green);border-radius:4px;padding:6px;background:rgba(39,174,96,0.08);box-shadow:0 0 40px rgba(39,174,96,0.3),0 0 80px rgba(39,174,96,0.15),inset 0 0 20px rgba(39,174,96,0.1)}
.photo-inner{width:clamp(200px,55vw,320px);aspect-ratio:3/4;overflow:hidden;border-radius:2px;position:relative;background:#111}
.photo-inner img{width:100%;height:100%;object-fit:cover;animation:photo-unblur 1.5s ease-out .3s both;filter:blur(20px) brightness(0.3)}
.declassified-stamp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-18deg);animation:stamp-slam .6s cubic-bezier(.22,1,.36,1) 1.2s both;pointer-events:none;z-index:5}
.declassified-stamp-inner{border:4px solid rgba(192,57,43,0.9);border-radius:6px;padding:.4rem 1.2rem;font-size:clamp(22px,6vw,36px);font-weight:700;color:rgba(192,57,43,0.9);text-transform:uppercase;letter-spacing:.2em;text-shadow:0 0 10px rgba(192,57,43,0.5);white-space:nowrap}
.phoenix-label{margin-top:1.5rem;font-size:clamp(16px,4.5vw,24px);font-weight:700;color:var(--accent-green);letter-spacing:.15em;text-transform:uppercase;text-shadow:0 0 20px rgba(39,174,96,0.6);animation:fade-up .6s ease-out 1.5s both;text-align:center}
.identity-label{margin-top:.5rem;font-size:clamp(10px,2.5vw,12px);color:var(--accent-green);opacity:.5;letter-spacing:.3em;text-transform:uppercase;animation:fade-up .5s ease-out 2s both}
/* Phase 3: Complete */
.phase-complete{display:flex;flex-direction:column;align-items:center;animation:fade-up .5s ease-out both}
.small-photo{border:2px solid var(--accent-green);border-radius:4px;padding:4px;background:rgba(39,174,96,0.05);box-shadow:0 0 30px rgba(39,174,96,0.2);margin-bottom:1.5rem;animation:fade-up .4s ease-out both}
.small-photo-inner{width:clamp(100px,30vw,160px);aspect-ratio:3/4;overflow:hidden;border-radius:2px;background:#111}
.small-photo-inner img{width:100%;height:100%;object-fit:cover}
.complete-stamp{border:4px solid var(--accent-green);border-radius:8px;padding:1.2rem 1.8rem;display:inline-block;transform:rotate(-2deg);animation:stamp-in .6s cubic-bezier(.22,1,.36,1) .2s forwards;opacity:0}
.mission-status{font-size:clamp(10px,2.5vw,13px);color:var(--accent-green);opacity:.7;letter-spacing:.3em;text-transform:uppercase;margin-bottom:.5rem}
.operation-text{font-size:clamp(24px,7vw,44px);font-weight:700;color:var(--accent-green);text-transform:uppercase;letter-spacing:.05em;line-height:1.2;text-shadow:0 0 20px rgba(39,174,96,0.6),0 0 40px rgba(39,174,96,0.3);animation:success-pulse 2s ease-in-out infinite}
.complete-divider{width:100%;height:2px;background:var(--accent-green);margin:.6rem 0;opacity:.4}
.complete-text{font-size:clamp(18px,5vw,32px);font-weight:700;color:var(--accent-green);text-transform:uppercase;letter-spacing:.15em}
.dismissed-text{font-size:clamp(10px,2.5vw,12px);color:var(--dim);letter-spacing:.2em;text-transform:uppercase;margin-top:1.5rem;animation:fade-up .5s ease-out .8s both}
/* Confetti */
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:203}
.confetti-piece{position:absolute;top:-10px;opacity:.85}
/* Animations */
@keyframes shake{0%,to{transform:translate(0)}10%,30%,50%,70%,90%{transform:translate(-8px)}20%,40%,60%,80%{transform:translate(8px)}}
@keyframes flash-red{0%{background-color:var(--bg)}20%{background-color:rgba(192,57,43,0.4)}40%{background-color:var(--bg)}60%{background-color:rgba(192,57,43,0.25)}to{background-color:var(--bg)}}
@keyframes flash-green{0%{background-color:var(--bg)}30%{background-color:rgba(39,174,96,0.3)}to{background-color:rgba(39,174,96,0.1)}}
@keyframes stamp-in{0%{transform:scale(3) rotate(-15deg);opacity:0}50%{transform:scale(1.05) rotate(-3deg);opacity:1}to{transform:scale(1) rotate(-2deg);opacity:1}}
@keyframes pulse-glow{0%,to{box-shadow:0 0 8px rgba(212,165,40,0.3),inset 0 0 4px rgba(212,165,40,0.1)}50%{box-shadow:0 0 20px rgba(212,165,40,0.6),inset 0 0 8px rgba(212,165,40,0.2)}}
@keyframes cursor-blink{0%,to{opacity:1}50%{opacity:0}}
@keyframes fade-up{0%{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes reveal-text{0%{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes success-pulse{0%,to{text-shadow:0 0 20px rgba(39,174,96,0.5)}50%{text-shadow:0 0 40px rgba(39,174,96,0.9),0 0 80px rgba(39,174,96,0.4)}}
@keyframes shackle-open{0%{transform:translateY(0) rotate(0);filter:drop-shadow(0 0 0 transparent)}20%{transform:translateY(-2px) rotate(0);filter:drop-shadow(0 0 8px rgba(39,174,96,0.4))}50%{transform:translateY(-18px) rotate(-15deg);filter:drop-shadow(0 0 20px rgba(39,174,96,0.7))}70%{transform:translateY(-28px) rotate(-30deg);filter:drop-shadow(0 0 30px rgba(39,174,96,0.9))}85%{transform:translateY(-32px) rotate(-38deg);filter:drop-shadow(0 0 25px rgba(39,174,96,0.6))}to{transform:translateY(-30px) rotate(-35deg);filter:drop-shadow(0 0 20px rgba(39,174,96,0.5))}}
@keyframes body-pulse{0%{filter:brightness(1)}30%{filter:brightness(1.4) drop-shadow(0 0 20px rgba(39,174,96,0.7))}60%{filter:brightness(1.1) drop-shadow(0 0 10px rgba(39,174,96,0.4))}to{filter:brightness(1) drop-shadow(0 0 5px rgba(39,174,96,0.2))}}
@keyframes spark{0%{r:0;opacity:0}50%{r:6;opacity:1}to{r:10;opacity:0}}
@keyframes photo-emerge{0%{transform:scale(.3) translateY(30px);opacity:0;filter:brightness(.2)}40%{transform:scale(.8) translateY(5px);opacity:.8;filter:brightness(.6)}to{transform:scale(1) translateY(0);opacity:1;filter:brightness(1)}}
@keyframes photo-unblur{0%{filter:blur(20px) brightness(.3)}50%{filter:blur(6px) brightness(.7)}to{filter:blur(0) brightness(1)}}
@keyframes stamp-slam{0%{transform:translate(-50%,-50%) rotate(-18deg) scale(4);opacity:0}50%{transform:translate(-50%,-50%) rotate(-18deg) scale(.95);opacity:1}70%{transform:translate(-50%,-50%) rotate(-18deg) scale(1.05);opacity:1}to{transform:translate(-50%,-50%) rotate(-18deg) scale(1);opacity:1}}
@keyframes confetti-fall{0%{transform:translateY(0) rotate(0);opacity:.9}to{transform:translateY(100vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<div class="container" id="app">
  <div class="bg-grid"></div>
  <div class="main" id="main-screen">
    <div class="classified-header">▰▰ CLASSIFIED // TOP SECRET — SCI ▰▰</div>
    <div class="lock-wrap" id="lock-icon">
      <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path id="shackle" d="M20 28V18C20 11.4 25.4 6 32 6C38.6 6 44 11.4 44 18V28" stroke="#d4a528" stroke-width="4" stroke-linecap="round" fill="none"/>
        <rect x="14" y="28" width="36" height="28" rx="4" fill="#d4a528" style="opacity:0.85"/>
        <circle cx="32" cy="40" r="4" fill="#1a1a1e"/><rect x="30" y="42" width="4" height="8" rx="1" fill="#1a1a1e"/>
      </svg>
    </div>
    <div class="digits" id="digits"></div>
    <div class="label-row">
      <div class="label-title">ENTER EXTRACTION CODE</div>
      <div class="label-sub">4-DIGIT AUTHORIZATION REQUIRED</div>
    </div>
    <div class="attempt-counter" id="attempt-counter">FAILED ATTEMPTS: <span id="attempt-num">0</span></div>
  </div>
</div>

<!-- Success overlay (hidden) -->
<div class="success-overlay" id="success-overlay" style="display:none">
  <div class="scanlines"></div>
  <div class="declassified-band">DECLASSIFIED // AUTHORIZATION CONFIRMED</div>
  <div class="success-content" id="success-content"></div>
  <div class="confetti" id="confetti"></div>
</div>

// === SOUND ENGINE (Web Audio API) — CIA/Classified Facility ===
let audioCtx = null;
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playKeyBeep() {
  // Mechanical keypad click — short filtered noise snap, like a physical button
  const ctx = getCtx();
  const bufLen = ctx.sampleRate * 0.04;
  const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufLen; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.004));
  const src = ctx.createBufferSource(); src.buffer = buf;
  const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 1800; bp.Q.value = 3;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.25, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
  src.connect(bp); bp.connect(gain); gain.connect(ctx.destination);
  src.start();
  // Subtle low confirmation underneath
  const osc = ctx.createOscillator();
  const g2 = ctx.createGain();
  osc.type = "sine"; osc.frequency.value = 320;
  g2.gain.setValueAtTime(0.06, ctx.currentTime);
  g2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);
  osc.connect(g2); g2.connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime + 0.06);
}

function playDenied() {
  // Security system rejection — low filtered sweep with static
  const ctx = getCtx();
  const t = ctx.currentTime;
  // Descending warning tone
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = "sawtooth";
  osc.frequency.setValueAtTime(280, t);
  osc.frequency.exponentialRampToValueAtTime(80, t + 0.6);
  const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 600;
  gain.gain.setValueAtTime(0.15, t);
  gain.gain.setValueAtTime(0.15, t + 0.3);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
  osc.connect(lp); lp.connect(gain); gain.connect(ctx.destination);
  osc.start(); osc.stop(t + 0.6);
  // Static burst
  const nBuf = ctx.createBuffer(1, ctx.sampleRate * 0.3, ctx.sampleRate);
  const nData = nBuf.getChannelData(0);
  for (let i = 0; i < nBuf.length; i++) nData[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.06));
  const nSrc = ctx.createBufferSource(); nSrc.buffer = nBuf;
  const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 2000;
  const nG = ctx.createGain(); nG.gain.setValueAtTime(0.1, t); nG.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
  nSrc.connect(hp); hp.connect(nG); nG.connect(ctx.destination); nSrc.start();
}

function playUnlock() {
  // Heavy vault bolt mechanism — layered impacts with metallic resonance
  const ctx = getCtx();
  const t = ctx.currentTime;
  // First bolt: heavy impact
  function bolt(delay) {
    const buf = ctx.createBuffer(1, ctx.sampleRate * 0.3, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < buf.length; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.015));
    const src = ctx.createBufferSource(); src.buffer = buf;
    const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 800; bp.Q.value = 2;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.3, t + delay);
    gain.gain.exponentialRampToValueAtTime(0.001, t + delay + 0.25);
    src.connect(bp); bp.connect(gain); gain.connect(ctx.destination);
    src.start(t + delay);
    // Metal resonance
    const osc = ctx.createOscillator();
    const rG = ctx.createGain();
    osc.type = "sine"; osc.frequency.value = 200 + Math.random() * 100;
    rG.gain.setValueAtTime(0.08, t + delay);
    rG.gain.exponentialRampToValueAtTime(0.001, t + delay + 0.4);
    osc.connect(rG); rG.connect(ctx.destination);
    osc.start(t + delay); osc.stop(t + delay + 0.4);
  }
  bolt(0); bolt(0.15); bolt(0.35);
  // Pneumatic hiss after bolts
  setTimeout(() => {
    const hBuf = ctx.createBuffer(1, ctx.sampleRate * 1.0, ctx.sampleRate);
    const hData = hBuf.getChannelData(0);
    for (let i = 0; i < hBuf.length; i++) hData[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.25));
    const hSrc = ctx.createBufferSource(); hSrc.buffer = hBuf;
    const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 3000;
    const hG = ctx.createGain(); hG.gain.setValueAtTime(0.08, ctx.currentTime); hG.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
    hSrc.connect(hp); hp.connect(hG); hG.connect(ctx.destination); hSrc.start();
  }, 450);
  // Deep room resonance
  const drone = ctx.createOscillator();
  const dG = ctx.createGain();
  drone.type = "sine"; drone.frequency.value = 55;
  dG.gain.setValueAtTime(0.12, t);
  dG.gain.setValueAtTime(0.12, t + 0.5);
  dG.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
  drone.connect(dG); dG.connect(ctx.destination);
  drone.start(); drone.stop(t + 1.2);
}

function playRevealSting() {
  // Cinematic bass hit with tension swell — like a classified file being opened
  const ctx = getCtx();
  const t = ctx.currentTime;
  // Deep bass hit
  const bass = ctx.createOscillator();
  const bG = ctx.createGain();
  bass.type = "sine";
  bass.frequency.setValueAtTime(65, t);
  bass.frequency.exponentialRampToValueAtTime(35, t + 1.5);
  bG.gain.setValueAtTime(0.2, t);
  bG.gain.setValueAtTime(0.15, t + 0.4);
  bG.gain.exponentialRampToValueAtTime(0.001, t + 1.5);
  bass.connect(bG); bG.connect(ctx.destination);
  bass.start(); bass.stop(t + 1.5);
  // Impact transient
  const impBuf = ctx.createBuffer(1, ctx.sampleRate * 0.15, ctx.sampleRate);
  const impData = impBuf.getChannelData(0);
  for (let i = 0; i < impBuf.length; i++) impData[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.008));
  const impSrc = ctx.createBufferSource(); impSrc.buffer = impBuf;
  const impG = ctx.createGain(); impG.gain.setValueAtTime(0.2, t); impG.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  impSrc.connect(impG); impG.connect(ctx.destination); impSrc.start();
  // Tension string pad (filtered saw)
  const pad = ctx.createOscillator();
  const pG = ctx.createGain();
  const pLP = ctx.createBiquadFilter(); pLP.type = "lowpass"; pLP.frequency.value = 400;
  pad.type = "sawtooth"; pad.frequency.value = 110;
  pG.gain.setValueAtTime(0, t);
  pG.gain.linearRampToValueAtTime(0.06, t + 0.8);
  pG.gain.exponentialRampToValueAtTime(0.001, t + 2.0);
  pad.connect(pLP); pLP.connect(pG); pG.connect(ctx.destination);
  pad.start(); pad.stop(t + 2.0);
}

function playMissionComplete() {
  // Authorized confirmation — deep, resonant, satisfying. Like a retinal scan accepted.
  const ctx = getCtx();
  const t = ctx.currentTime;
  // Two-tone confirmation: low then slightly higher
  [{f:220,d:0},{f:330,d:0.3}].forEach(({f,d}) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(f, t + d);
    gain.gain.setValueAtTime(0.12, t + d);
    gain.gain.setValueAtTime(0.12, t + d + 0.4);
    gain.gain.exponentialRampToValueAtTime(0.001, t + d + 1.0);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t + d); osc.stop(t + d + 1.0);
  });
  // Warm sub underneath
  const sub = ctx.createOscillator();
  const sG = ctx.createGain();
  sub.type = "sine"; sub.frequency.value = 80;
  sG.gain.setValueAtTime(0.08, t);
  sG.gain.exponentialRampToValueAtTime(0.001, t + 1.5);
  sub.connect(sG); sG.connect(ctx.destination);
  sub.start(); sub.stop(t + 1.5);
}

const CORRECT_CODE = "1121";
let state = "idle"; // idle | checking | denied | granted
let attempts = 0;
let activeIndex = 0;
let digits = ["","","",""];

// Build digit cells
const digitsEl = document.getElementById("digits");
const inputs = [];
for (let i = 0; i < 4; i++) {
  const wrap = document.createElement("div");
  wrap.className = "digit-wrap";
  const input = document.createElement("input");
  input.type = "tel"; input.inputMode = "numeric"; input.pattern = "[0-9]*";
  input.maxLength = 1; input.className = "digit-input";
  input.setAttribute("aria-label", `Digit ${i+1} of extraction code`);
  const cursor = document.createElement("div");
  cursor.className = "cursor-blink"; cursor.style.display = "none";
  wrap.appendChild(input); wrap.appendChild(cursor);
  digitsEl.appendChild(wrap);
  inputs.push(input);

  input.addEventListener("input", function(e) {
    if (state !== "idle") return;
    const v = e.target.value.replace(/[^0-9]/g,"").slice(-1);
    if (!v) return;
    digits[i] = v;
    playKeyBeep();
    updateCells();
    if (i < 3) { activeIndex = i + 1; focusActive(); }
    else { input.blur(); checkCode(); }
  });
  input.addEventListener("keydown", function(e) {
    if (state !== "idle") return;
    if (e.key === "Backspace") {
      if (digits[i]) { digits[i] = ""; updateCells(); }
      else if (i > 0) { digits[i-1] = ""; activeIndex = i-1; updateCells(); focusActive(); }
    }
  });
  input.addEventListener("focus", function() { activeIndex = i; updateCells(); });
}

function updateCells() {
  inputs.forEach((inp, i) => {
    inp.value = digits[i];
    inp.className = "digit-input" + (digits[i] ? " filled" : "") + (i === activeIndex && state === "idle" ? " active" : "");
    const cursor = inp.nextElementSibling;
    cursor.style.display = (i === activeIndex && !digits[i] && state === "idle") ? "block" : "none";
  });
}

function focusActive() { if (activeIndex < 4) inputs[activeIndex].focus(); }

function checkCode() {
  state = "checking";
  const code = digits.join("");
  if (code === CORRECT_CODE) {
    state = "granted"; playUnlock(); showSuccess();
  } else {
    attempts++;
    document.getElementById("attempt-num").textContent = attempts;
    const counter = document.getElementById("attempt-counter");
    counter.classList.add("visible");
    state = "denied"; playDenied(); showDenied();
  }
}

function showDenied() {
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.style.animation = "flash-red 0.8s ease-out";
  overlay.innerHTML = '<div class="denied-text">ACCESS DENIED</div><div class="denied-sub">INCORRECT CODE — TRY AGAIN, AGENT</div>';
  document.body.appendChild(overlay);
  // Shake digits
  digitsEl.style.animation = "shake 0.5s ease-in-out";
  setTimeout(() => { digitsEl.style.animation = "none"; }, 600);
  setTimeout(() => {
    digits = ["","","",""];
    activeIndex = 0;
    updateCells();
    overlay.remove();
    state = "idle";
    focusActive();
  }, 1800);
}

function showSuccess() {
  document.getElementById("main-screen").style.display = "none";
  const overlay = document.getElementById("success-overlay");
  overlay.style.display = "flex";
  const content = document.getElementById("success-content");

  // Phase 1: Unlocking
  content.innerHTML = `
    <div class="phase-unlock">
      <div class="big-lock">
        <svg width="160" height="180" viewBox="0 0 160 180" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M40 80V50C40 28 56 12 80 12C104 12 120 28 120 50V80" stroke="#27ae60" stroke-width="10" stroke-linecap="round" fill="none" style="animation:shackle-open 1.8s cubic-bezier(.34,1.56,.64,1) .3s forwards;transform-origin:40px 80px"/>
          <rect x="25" y="80" width="110" height="80" rx="10" fill="#27ae60" style="animation:body-pulse 1.5s ease-in-out .5s both"/>
          <circle cx="80" cy="112" r="10" fill="#0a0a0a"/><rect x="75" y="118" width="10" height="20" rx="3" fill="#0a0a0a"/>
          <circle cx="38" cy="50" r="3" fill="#2ecc71" style="animation:spark .4s ease-out 1.2s both"/>
          <circle cx="122" cy="50" r="3" fill="#2ecc71" style="animation:spark .4s ease-out 1.4s both"/>
          <circle cx="80" cy="10" r="2" fill="#f1c40f" style="animation:spark .4s ease-out 1.3s both"/>
        </svg>
      </div>
      <div class="code-accepted">CODE ACCEPTED</div>
      <div class="unlocking-text">UNLOCKING VAULT...</div>
    </div>`;

  // Phase 2: Photo reveal
  setTimeout(() => {
    content.innerHTML = `
      <div class="phase-reveal">
        <div class="photo-container">
          <div class="photo-frame">
            <div class="photo-inner"><img src="${TRISH_IMG}" alt="Trish — Phoenix Bride"/></div>
          </div>
          <div class="declassified-stamp"><div class="declassified-stamp-inner">DECLASSIFIED</div></div>
        </div>
        <div class="phoenix-label">PHOENIX BRIDE — EXTRACTED</div>
        <div class="identity-label">IDENTITY CONFIRMED // ASSET SECURED</div>
      </div>`;
    spawnConfetti();
    playRevealSting();
  }, 2000);

  // Phase 3: Complete
  setTimeout(() => {
    content.innerHTML = `
      <div class="phase-complete">
        <div class="small-photo"><div class="small-photo-inner"><img src="${TRISH_IMG}" alt="Trish"/></div></div>
        <div class="complete-stamp">
          <div class="mission-status">MISSION STATUS</div>
          <div class="operation-text">OPERATION<br/>TRISH</div>
          <div class="complete-divider"></div>
          <div class="complete-text">COMPLETE</div>
        </div>
        <div class="dismissed-text">ALL STATIONS CLEARED // AGENT DISMISSED</div>
      </div>`;
    playMissionComplete();
  }, 5500);
}

function spawnConfetti() {
  const container = document.getElementById("confetti");
  const colors = ["#27ae60","#d4a528","#2ecc71","#f1c40f","#1abc9c","#e74c3c"];
  for (let i = 0; i < 40; i++) {
    const piece = document.createElement("div");
    piece.className = "confetti-piece";
    const size = 4 + Math.random() * 8;
    piece.style.cssText = `left:${Math.random()*100}%;width:${size}px;height:${size}px;background:${colors[i%colors.length]};border-radius:${i%3===0?"50%":"1px"};transform:rotate(${Math.random()*360}deg);animation:confetti-fall ${2+Math.random()*3}s ease-in ${Math.random()*2}s both`;
    container.appendChild(piece);
  }
}

// Init
updateCells();
focusActive();
</script>
</body>
</html>
